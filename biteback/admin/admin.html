<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteBack Admin</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="header">

        <div class="logo">
            <img src="../logo.png" alt="BiteBack Logo" class="logo_img">

            <a href="../index.html" class="logo_name">
                <span style="color:black;">Bite</span>
                <span style="color:green;">Back</span>
            </a>
        </div>

        <div class="menu_toggle" onclick="toggleMenu()">☰</div>

        <div class="nav" id="navMenu">
            <a href="admin.html" class="nav1">Applicants</a>
            <a href="surplus.html" class="nav2">Surplus</a>
        </div>

    </div>

    <div class="content">

        <h1>Applicants</h1>

        <table class="applicants_table" id="applicantsTable">
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>
        </table>

    </div>

    <script>
        fetch('applicants.php')
            .then(response => response.json())
            .then(data => {

                console.log(data); // check browser console

                const table = document.getElementById("applicantsTable");

                const rows = data.map(applicant => `
<tr>
    <td>${applicant.username}</td>
    <td>${applicant.mobile}</td>
    <td class="action_buttons">
        <button class="approve_btn" onclick="approveApplicant(${applicant.id})">
            Approve
        </button>

        <button class="reject_btn" onclick="rejectApplicant(${applicant.id})">
            Reject
        </button>
    </td>
</tr>
`).join('');
                table.innerHTML += rows;

            })
            .catch(error => console.log(error));
    </script>

</body>
<script>
    function toggleMenu() {
        document.getElementById("navMenu").classList.toggle("active");
    }
</script>
<script>
function approveApplicant(id) {
    fetch("approve.php?id=" + id)
        .then(response => response.text())
        .then(data => {
            location.reload();
        })
        .catch(error => {
            alert("Error approving applicant");
        });
}

function rejectApplicant(id) {
    fetch("reject.php?id=" + id)
        .then(response => response.text())
        .then(data => {
            location.reload();
        })
        .catch(error => {
            alert("Error rejecting applicant");
        });
}
</script>
</html>
